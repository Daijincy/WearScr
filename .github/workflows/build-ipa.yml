name: Build WearScr IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install meson ninja cmake nasm pkg-config fmt googletest go
          # protobuf 必须 28.3（adb-mobile 硬依赖）
          brew unlink protobuf || true
          brew install --formula external/adb-mobile/porting/protobuf.rb
          brew link --overwrite protobuf
          protoc --version

      - name: Build porting libraries (adb + sdl + ffmpeg + scrcpy)
        run: |
          make -C porting
          echo "=== porting/libs 产物 ==="
          find porting/libs -name "*.a" | head -30

      - name: Xcode archive (unsigned)
        run: |
          xcodebuild archive \
            -project "scrcpy-app/Scrcpy Remote.xcodeproj" \
            -scheme "Scrcpy Remote" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/WearScr.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            2>&1 | tail -40

      - name: Package IPA
        run: |
          APP_PATH="build/WearScr.xcarchive/Products/Applications/Scrcpy Remote.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "App not found, searching..."
            find build/WearScr.xcarchive -name "*.app" -maxdepth 5
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" "Payload/WearScr.app"
          # 修正 Info.plist 显示名
          /usr/libexec/PlistBuddy -c "Set :CFBundleDisplayName WearScr" "Payload/WearScr.app/Info.plist" 2>/dev/null || true
          zip -qr WearScr-unsigned.ipa Payload
          ls -la WearScr-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WearScr-unsigned
          path: WearScr-unsigned.ipa
          retention-days: 30
